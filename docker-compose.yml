version: "3.9"

services:

  trading-desk:
    build: .
    container_name: trading_desk
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://trader:password@timescaledb:5432/trading
      - REDIS_URL=redis://redis:6379/0
      - TRADING_MODE=paper
      - BINANCE_TESTNET=true
      - ALERT_CHANNEL=console
    depends_on:
      - timescaledb
      - redis
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trading
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  timescale_data:
